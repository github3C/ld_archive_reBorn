  <script>
(function () {
  var form = document.querySelector("[data-floor-jump]");
  if (!form) {
    return;
  }
  var input = form.querySelector("input[name='floor']");
  var status = document.querySelector("[data-floor-jump-status]");

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    jumpToFloor(input ? input.value : "");
  });

  normalizeInitialHash();

  function normalizeInitialHash() {
    var rawHash = decodeURIComponent(window.location.hash || "");
    var match = rawHash.match(/^#(\d+)$/);
    if (!match) {
      return;
    }
    window.setTimeout(function () {
      jumpToFloor(match[1], true);
    }, 0);
  }

  function jumpToFloor(value, replaceHash) {
    var floor = Number.parseInt(String(value || "").trim(), 10);
    if (!Number.isFinite(floor) || floor < 1) {
      setStatus("Enter a valid floor number.", "error");
      return;
    }
    var targetId = "post-" + floor;
    var target = document.getElementById(targetId);
    if (!target) {
      setStatus("Floor #" + floor + " is not in this archive.", "error");
      return;
    }
    setStatus("");
    if (input) {
      input.value = String(floor);
    }
    var nextHash = "#" + targetId;
    try {
      if (replaceHash) {
        window.history.replaceState(null, "", nextHash);
      } else {
        window.history.pushState(null, "", nextHash);
      }
    } catch (_error) {
      window.location.hash = nextHash;
    }
    target.scrollIntoView({ block: "start" });
  }

  function setStatus(message, state) {
    if (!status) {
      return;
    }
    status.textContent = message || "";
    if (state) {
      status.dataset.state = state;
    } else {
      delete status.dataset.state;
    }
  }
})();
</script>
